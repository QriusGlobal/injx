repos:
  # Smart commit message validation
  - repo: local
    hooks:
      - id: validate-commit
        name: Validate commit message
        entry: bun run scripts/validate-commit.js
        language: system
        stages: [commit-msg]
        pass_filenames: false

      - id: full-ci
        name: Full CI pipeline
        entry: bash scripts/ci-local.sh
        language: system
        stages: [commit]
        pass_filenames: false
        always_run: true
