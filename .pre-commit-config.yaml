repos:
  # Commit message validation
  - repo: local
    hooks:
      - id: validate-commit
        name: Validate commit message
        entry: bun run scripts/validate-commit.js
        language: system
        stages: [commit-msg]
        pass_filenames: false

  # Code quality
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-format
        files: ^src/
      - id: ruff
        files: ^src/
        args: ["--exit-non-zero-on-fix"]

  # Type checking and docs
  - repo: local
    hooks:
      - id: basedpyright
        name: Type check (basedpyright)
        entry: basedpyright src
        language: system
        files: ^src/
        pass_filenames: false

      - id: mkdocs-build
        name: Documentation build (MkDocs --strict)
        entry: uv run mkdocs build --strict
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Test suite
        entry: uv run pytest --tb=short -q
        language: system
        files: ^(src/|tests/)
        pass_filenames: false
